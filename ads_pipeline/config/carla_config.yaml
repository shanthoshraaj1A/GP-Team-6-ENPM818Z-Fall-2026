# ---------------------------------------------------------------------------
# GP1 sensor configuration
#
# Every value your node uses must come from this file. A node with numbers
# hard-coded in it loses marks on Task 2, and you cannot answer Task 4's
# "change the blueprint without editing source" requirement without it.
#
# IMPORTANT: the mount transforms below are PLACEHOLDERS. Replace them with
# your team's assigned rig from the GP1 page, then derive the exact numbers
# from vehicle.bounding_box.extent rather than copying them blindly, since
# blueprints differ in size.
# ---------------------------------------------------------------------------
sensor_manager:
  ros__parameters:

    # --- CARLA connection -------------------------------------------------
    host: "localhost"
    port: 2000
    timeout_s: 10.0

    # --- Simulation -------------------------------------------------------
    # Synchronous mode is not optional. Without it the sensor streams arrive
    # at irregular times, two runs disagree, and Task 5 has no way to pair a
    # camera frame with a LiDAR sweep from the same instant.
    synchronous_mode: true
    fixed_delta_seconds: 0.05          # 20 Hz

    # --- World ------------------------------------------------------------
    # Load the map explicitly. spawn_index is an index into
    # world.get_map().get_spawn_points(), and that list is different on
    # every map, so the index means nothing without the town.
    town: "Town01"

    # --- Ego vehicle ------------------------------------------------------
    vehicle_blueprint: "vehicle.toyota.prius"
    spawn_index: 58
    autopilot: false                            # true for the Task 3 drive
    traffic_manager_port: 8000

    # --- GP3: ground truth, traffic and the length of the drive ----------
    # record_gp3_launch.py turns on autopilot, ground_truth and
    # ignore_lights and sets max_sim_s to its duration, so they stay off
    # here. The traffic is the GP3 drive's: 80 vehicles and 150 walkers
    # with seed 818. Set both counts to 0 for an empty town.
    ground_truth: false
    ignore_lights: false
    max_sim_s: 0.0                              # 0 = run until Ctrl+C
    traffic:
      vehicles: 80
      walkers: 150
      seed: 818

    # --- Mount transforms, metres and degrees -----------------------------
    # These feed both the CARLA spawn and the static TF tree, so the two
    # cannot disagree. Each key is that sensor's TF child frame, under the
    # parent frame 'ego_vehicle', and is the frame_id on its messages.
    mounts:
      camera_rgb_front:
        x: 1.62
        y: 0.26
        z: 1.57
        roll: 0.0
        pitch: -6.6
        yaw: 0.0
      # Depth and semantic cameras share the RGB mount so the three images
      # are pixel-aligned. Keep them identical to camera_rgb_front.
      camera_depth_front:
        x: 1.62
        y: 0.26
        z: 1.57
        roll: 0.0
        pitch: -6.6
        yaw: 0.0
      camera_semseg_front:
        x: 1.62
        y: 0.26
        z: 1.57
        roll: 0.0
        pitch: -6.6
        yaw: 0.0
      lidar_top:
        x: 0.0
        y: 0.0
        z: 2.8
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      radar_front:
        x: 2.2
        y: 0.0
        z: 0.8
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      # GP3, rig A's antenna: 1.22 m behind the origin and 0.72 m to the
      # RIGHT. The GP3 table gives y = -0.72 with y to the left; CARLA's y
      # points right, so the sign flips here.
      gnss_link:
        x: -1.22
        y: 0.72
        z: 2.8
        roll: 0.0
        pitch: 0.0
        yaw: 0.0
      imu_link:
        x: 0.0
        y: 0.0
        z: 1.0
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

    # --- Sensor attributes ------------------------------------------------
    camera:
      width: 1280
      height: 720
      fov: 110.0
      sensor_tick: 0.05

    depth_camera:
      width: 1280
      height: 720
      fov: 110.0
      sensor_tick: 0.05

    semseg_camera:
      width: 1280
      height: 720
      fov: 110.0
      sensor_tick: 0.05

    lidar:
      channels: 64
      range: 100.0
      points_per_second: 560000
      rotation_frequency: 20.0
      upper_fov: 10.0
      lower_fov: -30.0
      sensor_tick: 0.05

    radar:
      horizontal_fov: 30.0
      vertical_fov: 10.0
      range: 100.0
      points_per_second: 1500
      sensor_tick: 0.05

    gnss:
      noise_lat_stddev: 0.000005
      noise_lon_stddev: 0.000005
      noise_alt_stddev: 0.05
      sensor_tick: 0.1

    imu:
      noise_accel_stddev_x: 0.05
      noise_accel_stddev_y: 0.05
      noise_accel_stddev_z: 0.05
      noise_gyro_stddev_x: 0.001
      noise_gyro_stddev_y: 0.001
      noise_gyro_stddev_z: 0.001
      # A sensor_tick shorter than fixed_delta_seconds is clamped to one
      # measurement per tick, so 0.01 here would still deliver 20 Hz.
      sensor_tick: 0.05
